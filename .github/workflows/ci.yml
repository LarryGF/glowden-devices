name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Same base as the plugin release build (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev pkg-config
          pip install tomli
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build plugins
        run: cargo build --release --locked
      # Catches broken device definitions before a release does.
      - name: Build the source
        run: tools/make-index.py dist --version 0.0.0-ci --plugin blue-voice=target/release/glowden-blue-voice
